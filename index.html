<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1a2e">
  <title>AeroCast</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
  <main id="app" class="app">
    <section id="current-weather" aria-label="Current weather"></section>
    <section id="hourly-forecast" aria-label="Hourly forecast"></section>
    <section id="daily-forecast" aria-label="Daily forecast"></section>
    <section id="weather-details" aria-label="Weather details"></section>
    <section id="weather-alert" aria-live="polite"></section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
