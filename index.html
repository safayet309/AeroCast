<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AeroCast — Weather Forecast</title>

  <meta
    name="description"
    content="AeroCast — your personal weather forecast and current weather updates."
  >

  <meta name="theme-color" content="#0b1220">

  <link rel="manifest" href="./manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
  <div id="app">
    <header class="app-header">
      <a class="app-logo" href="./" aria-label="AeroCast home">
        <span class="app-logo__icon" aria-hidden="true">☁</span>
        <span class="app-logo__text">AeroCast</span>
      </a>
    </header>

    <main id="main-content" class="app-main">
      <section
        id="weather-dashboard"
        class="weather-dashboard"
        aria-label="Weather dashboard"
      >
        <h1>Welcome to AeroCast</h1>
        <p>Your weather dashboard will appear here.</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>Weather updates powered by AeroCast.</p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
